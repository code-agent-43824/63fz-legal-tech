services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: 63fz_legal_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 63fz_legal_tech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
