name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: 63fz_legal_tech_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Fails the run on a known advisory in a production dependency. When that happens the fix is
      # usually a pinned override in pnpm-workspace.yaml, as was done for postcss and deepmerge-ts.
      # If an unrelated upstream advisory ever blocks an urgent release, drop this step for that
      # run rather than shipping an unreviewed override.
      - name: Security audit (production dependencies)
        run: pnpm run security:audit

      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5439/63fz_legal_tech_test

      - name: Fast tests (unit + DB integration)
        run: pnpm test
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5439/63fz_legal_tech_test

      - name: Verify database operations preflight
        run: |
          pnpm exec prisma db execute --stdin --url="$DATABASE_URL" <<'SQL'
          CREATE ROLE fz63_app NOLOGIN;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC, fz63_app;
          GRANT USAGE ON SCHEMA public TO fz63_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO fz63_app;
          INSERT INTO "Law" ("id", "slug", "title", "number", "createdAt", "updatedAt")
          VALUES ('ci-law', '63fz', 'CI law', '63-ФЗ', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          INSERT INTO "LawVersion" ("id", "lawId", "title", "status", "createdAt", "updatedAt")
          VALUES ('ci-version', 'ci-law', 'CI version', 'published', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          UPDATE "Law" SET "currentVersionId" = 'ci-version' WHERE "id" = 'ci-law';
          SQL
          pnpm run db:ops:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5439/63fz_legal_tech_test

      - name: Production build
        run: pnpm run build
